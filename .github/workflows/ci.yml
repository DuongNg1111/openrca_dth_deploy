name: CI
on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyyaml
      - name: Lint
        run: ruff check . || true
      - name: Smoke test
        run: python -m pytest -q
