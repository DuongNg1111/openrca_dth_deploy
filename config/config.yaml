# Project configuration. The loader also works WITHOUT PyYAML (uses defaults),
# so the smoke test runs even before you `pip install -r requirements.txt`.

system: "Market"          # OpenRCA system: Telecom | Bank | Market
data_root: "/home/ubuntu/Market"           # where the dataset lives (gitignored)
use_mock: false                # true = run on built-in mock telemetry (no dataset needed)
default_date: "2021-03-25"
top_k: 1                      # how many root-cause candidates to output

example_query: "On 2021-03-25 between 09:00 and 09:30 the delivery-tracking service showed elevated errors. Identify the root cause component and the root cause reason."

llm:
  source: "Gemini"
  model: "gemini-2.5-pro"
  api_key_env: "GEMINI_API_KEY"
